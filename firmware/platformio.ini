; ─── Pulse Edge wearable firmware (ESP32-WROOM-32E) ────────────────────────
;
; Two environments:
;   wearable   — production build for the bare ESP32-WROOM module on PCB
;   devboard   — same source, optimized for an ESP32 dev board over USB
;                (faster upload, serial logging on, brownout detector tuned)
;
; Both use NimBLE-Arduino instead of the default ESP32 BLE stack — it's
; ~50% smaller and ~2× faster for high-rate notifications.

[platformio]
default_envs = devboard

[env]
platform = espressif32@^6.7.0
framework = arduino
monitor_speed = 115200
monitor_filters = direct, esp32_exception_decoder

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    electroniccats/MPU6050@^1.4.1

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUHAL_LOG_COLORS=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_FREERTOS_HZ=1000

[env:wearable]
board = esp32dev
upload_protocol = esptool
build_flags =
    ${env.build_flags}
    -DPULSE_EDGE_WEARABLE=1

[env:devboard]
board = esp32dev
upload_protocol = esptool
build_flags =
    ${env.build_flags}
    -DPULSE_EDGE_DEVBOARD=1
