name: pulse_edge
description: Private wearable health monitor with local alerts, trends, and health reports.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management + routing
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.3

  # Persistence
  drift: ^2.33.0
  sqlite3_flutter_libs: ^0.6.0+eol
  sqlcipher_flutter_libs: ^0.7.0+eol
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.5.2

  # BLE + sensor I/O
  flutter_blue_plus: ^2.3.2
  permission_handler: ^12.0.1

  # ML
  tflite_flutter: ^0.12.0

  # Auth + crypto
  local_auth: ^3.0.1
  local_auth_android: ^2.0.0
  local_auth_darwin: ^2.0.0
  flutter_secure_storage: ^10.2.0
  crypto: ^3.0.6

  # Background work
  flutter_foreground_task: ^9.2.1
  flutter_local_notifications: ^21.0.0

  # UI
  fl_chart: ^1.2.0
  google_fonts: ^8.1.0
  flutter_svg: ^2.2.0
  lottie: ^3.3.1

  # Utilities
  intl: ^0.20.2
  collection: ^1.19.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  logger: ^2.5.0
  equatable: ^2.0.5
  uuid: ^4.5.1
  rxdart: ^0.28.0
  device_info_plus: ^10.1.0

  cupertino_icons: ^1.0.8
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  drift_dev: ^2.33.0
  freezed: ^3.2.5
  json_serializable: ^6.10.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lottie/
    - assets/models/

  fonts:
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
        - asset: assets/fonts/SpaceMono-Italic.ttf
          style: italic
        - asset: assets/fonts/SpaceMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/SpaceMono-BoldItalic.ttf
          weight: 700
          style: italic
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
